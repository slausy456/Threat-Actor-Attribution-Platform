version: "3.9"

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/changeme_local_dev
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=changeme_local_dev
      - POSTGRES_DB=attribution
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - postgres
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - DATABASE_URL=postgresql://app:changeme_local_dev@postgres:5432/attribution

  dashboard:
    build: ../dashboard
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  neo4j_data:
  pg_data:
